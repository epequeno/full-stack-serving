[project]
name = "full-stack-serving"
version = "0.1.0"
description = "Measured LLM serving stack. loadgen/ and measure/ are the shared instruments."
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loadgen", "measure"]
